# Fails a PR whose bundle copies under bundles/ have drifted from the canonical
# skills/ and assets/ trees, or that reintroduces a symlink into a bundle.
#
# Each bundles/<name>/ is its own Agent Plugins plugin root, and the spec
# rejects symlinks that resolve outside it, so bundles hold real copies
# generated by ./sync-bundles.sh. This keeps those copies honest.

name: Check bundle copies

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bundle copies match skills/ and assets/
        run: ./check-bundles.sh
