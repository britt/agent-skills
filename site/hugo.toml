baseURL = 'https://britt.github.io/britts-agent-skills/'
locale = 'en-us'
title = "Britt's Agent Skills"
theme = 're-terminal'
copyright = '© 2026 Snugglebear Team Company'

[pagination]
  pagerSize = 10

[params]
  # re-terminal renders params.copyright in the footer; the root key feeds RSS
  copyright = '© 2026 Snugglebear Team Company'
  # re-terminal reads the homepage/OG description from subtitle
  subtitle = 'A collection of skills to enhance AI-assisted development workflows'
  keywords = 'agent skills, claude code, codex, cursor, hugo, ai coding agents'
  # re-terminal's head.html reads params.favicon as the og:image source. It does
  # NOT affect the favicon <link> tags, which take the static/favicon.ico branch.
  # Without this the theme falls back to img/favicon/<themeColor>.png, which the
  # theme does not ship at all — so the share card was 404ing.
  favicon = 'og-image.png'
  # Palette lives in assets/css/color/vaporwave.scss, sampled from assets/icon.png
  themeColor = 'vaporwave'
  contentTypeName = 'skills'
  showMenuItems = 3
  fullWidthTheme = false
  centerTheme = true
  oneHeadingSize = true
  readingTime = false
  showLanguageSelector = false
  readMore = 'Read more'
  readOtherPosts = 'Read other skills'
  newerPosts = 'Newer skills'
  olderPosts = 'Older skills'
  menuMore = 'Show more'

  [params.logo]
    logoText = "britt's agent-skills"

[[menu.main]]
  identifier = 'skills'
  name = 'Skills'
  pageRef = '/skill-list'
  weight = 10

[[menu.main]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/britt/britts-agent-skills'
  weight = 30
  [menu.main.params]
    newTab = true

[[menu.main]]
  identifier = 'contributing'
  name = 'Contributing'
  url = 'https://github.com/britt/britts-agent-skills/blob/main/CONTRIBUTING.md'
  weight = 40
  [menu.main.params]
    newTab = true
